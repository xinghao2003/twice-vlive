<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video archive</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <div>
          <p class="eyebrow">Static archive</p>
          <h1 id="board-title">Video archive</h1>
          <p id="board-summary" class="muted">Loading videos…</p>
        </div>
        <a id="next-unwatched" class="button primary" href="video.html">Play next unwatched</a>
      </header>

      <section class="toolbar" aria-label="Archive controls">
        <label for="sort-order">Sort by</label>
        <select id="sort-order">
          <option value="oldest">Oldest first</option>
          <option value="latest">Latest first</option>
        </select>
        <span id="view-summary" class="muted"></span>
      </section>

      <p id="error" class="message error" hidden></p>
      <section id="video-list" class="video-list" aria-live="polite"></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
